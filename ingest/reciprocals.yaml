# Staging source for club-moorage-mcp `relationship: reciprocal` records.
# Canonical, reviewable data; build_records.py renders these to reciprocals/<slug>.md
# in the club-moorage-mcp frontmatter+prose format. Field meanings are in README.md.
#
# Two tranches, and they differ in depth — `confidence` says which one a record is from:
#
# 1. Researched (2026-06-10, confidence med/high): the BC + Washington clubs Naturali
#    actually cruises. Provenance: references/reciprocal-moorage.md (RVYC 2024 Annual +
#    web research) and references/data/rvyc-reciprocal-map.kml (coords). Terms, fees, LOA
#    limits and Vaan fit are researched per club.
# 2. Listed only (2026-08-25, confidence low): the rest of the RVYC 2024 Annual list —
#    worldwide, so the clubs on the delivery route home (Caribbean, Mexico, California,
#    Hawaii) are answerable. Position, address, phone and website come from RVYC's own
#    reciprocal map; guest-moorage terms are NOT researched. Every one carries a
#    call-ahead flag. Two records (Washington YC, West Indies YC) are on the map but not
#    in the Annual — flagged as such.
#
# The annual's phone column is misaligned in the Canadian-Royal section (Royal
# Newfoundland is printed with Nova Scotia's number), so phones come from the KML.
# Every row is verify-before-arrival.

